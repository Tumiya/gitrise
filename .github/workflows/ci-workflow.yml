name: CI pipeline

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint
        uses: Azbagheri/shell-linter@latest
        with:
          exclude-paths: "tests/shunit2,testdata/html_response,LICENSE"
 
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tests
        run: ./tests/test_runner
        shell: bash
    needs: lint 